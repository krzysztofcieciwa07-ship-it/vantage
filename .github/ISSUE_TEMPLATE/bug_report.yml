name: Bug report
description: Report a reproducible defect in Vantage.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, credentials, customer data, or private evidence."
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
      placeholder: "40-character commit SHA"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Sanitized reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: CI evidence
      description: Include workflow run links and exact failing checks. Remove sensitive data.
    validations:
      required: false
